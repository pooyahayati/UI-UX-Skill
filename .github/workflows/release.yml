name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          EXPECTED="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$EXPECTED"

      - name: Validate
        run: python3 scripts/validate_release.py

      - name: Package
        run: python3 scripts/package_release.py --output dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "UI/UX Skill $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for release details." \
            dist/*.zip \
            dist/SHA256SUMS.txt
