name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-skill.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi

      - name: Package validated source
        run: python3 scripts/package_release.py --output dist

      - name: Verify release archives
        run: |
          unzip -t dist/ui-ux-skill-claude-v*.zip
          unzip -t dist/ui-ux-plugin-v*.zip
          cat dist/SHA256SUMS.txt

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UI/UX Skill $TAG" \
            --notes "See CHANGELOG.md for release details." \
            dist/*.zip \
            dist/SHA256SUMS.txt

      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          if [ "$EXISTS" = "true" ]; then
            echo "Release $TAG already existed; shared validation gate and packaging passed."
          else
            echo "Published release $TAG after the shared validation gate."
          fi
