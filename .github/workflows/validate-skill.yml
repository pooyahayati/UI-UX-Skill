name: Validate Skill and Plugin

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release metadata validation
        run: python3 scripts/validate_release.py

      - name: Roadmap policy regression tests
        run: python3 scripts/test_roadmap_policy.py

      - name: WordPress settings evidence and isolation regressions
        run: |
          python3 evals/wordpress-settings/test_contracts.py
          node evals/wordpress-settings/test_model.cjs

      - name: Release packaging path safety and failure preservation
        run: python3 scripts/test_package_release.py

      - name: Package-local resource routing regressions and source integrity
        run: |
          python3 scripts/test_resource_routes.py
          python3 scripts/validate_resource_routes.py

      - name: Synthetic handbook migration compatibility
        run: python3 scripts/test_handbook_migration.py

      - name: Raw sample-eval preparation and preservation
        run: python3 scripts/test_sample_inputs.py

      - name: Authored sample assets and raw-input boundary
        run: python3 scripts/test_sample_artifact.py

      - name: Material sample phase and asset consistency
        run: python3 scripts/test_material_sample.py

      - name: Runtime appearance contract, persistence and trusted HTTP boundary
        run: python3 scripts/test_runtime_appearance.py

      - name: Runtime dialog keyboard regression (DOM model)
        run: node scripts/test_runtime_dialogs.mjs

      - name: Runtime stale-draft recovery regression (DOM and HTTP model)
        run: node scripts/test_runtime_recovery.mjs

      - name: Product route and isolation validation
        run: python3 scripts/validate_product_routes.py

      - name: Shared rule validation
        run: python3 scripts/validate_shared_rules.py

      - name: Design system validation
        run: python3 scripts/validate_design_system.py

      - name: Specialist registry validation
        run: |
          python3 scripts/test_specialists.py
          python3 scripts/validate_specialists.py

      - name: Behavioral eval fixture and isolation validation
        run: python3 scripts/validate_eval_fixtures.py

      - name: Real-world product isolation evaluation
        run: |
          python3 scripts/validate_real_world_evaluation.py
          python3 scripts/validate_eval_result.py evals/real-world/result.json

      - name: Recorded evaluation verdict consistency regressions
        run: python3 scripts/test_eval_result.py

      - name: Eval harness smoke test
        run: |
          python3 scripts/prepare_eval_run.py existing-safe-improvement --output "$RUNNER_TEMP/uiux-eval"
          test -f "$RUNNER_TEMP/uiux-eval/RUN.json"
          test -f "$RUNNER_TEMP/uiux-eval/fixture/README.md"

      - name: Package release artifacts
        run: python3 scripts/package_release.py --output dist

      - name: Verify ZIP archives and embedded Skill version
        run: |
          unzip -t dist/ui-ux-skill-claude-v*.zip
          unzip -t dist/ui-ux-plugin-v*.zip
          unzip -q dist/ui-ux-skill-claude-v*.zip -d "$RUNNER_TEMP/uiux-skill-consumer"
          unzip -q dist/ui-ux-plugin-v*.zip -d "$RUNNER_TEMP/uiux-plugin-consumer"
          python3 scripts/validate_resource_routes.py --skill-root "$RUNNER_TEMP/uiux-skill-consumer/ui-ux-skill" --skill-root "$RUNNER_TEMP/uiux-plugin-consumer/ui-ux/skills/ui-ux-skill"
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(unzip -p dist/ui-ux-skill-claude-v*.zip ui-ux-skill/VERSION | tr -d '\r\n')" = "$EXPECTED_VERSION"
          test "$(unzip -p dist/ui-ux-plugin-v*.zip ui-ux/skills/ui-ux-skill/VERSION | tr -d '\r\n')" = "$EXPECTED_VERSION"
          cat dist/SHA256SUMS.txt

      - name: Fetch official OpenAI skill tools
        run: git clone --depth 1 https://github.com/openai/skills.git "$RUNNER_TEMP/openai-skills"

      - name: Official OpenAI quick validation
        run: |
          python3 "$RUNNER_TEMP/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py" \
            skills/ui-ux-skill

      - name: Codex installer smoke test
        if: github.event_name == 'push'
        run: |
          python3 "$RUNNER_TEMP/openai-skills/skills/.system/skill-installer/scripts/install-skill-from-github.py" \
            --repo pooyahayati/UI-UX-Skill \
            --path skills/ui-ux-skill \
            --ref "$GITHUB_SHA" \
            --dest "$RUNNER_TEMP/installed-skills"

          test -f "$RUNNER_TEMP/installed-skills/ui-ux-skill/SKILL.md"
          test -f "$RUNNER_TEMP/installed-skills/ui-ux-skill/VERSION"
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          INSTALLED_VERSION="$(tr -d '\r\n' < "$RUNNER_TEMP/installed-skills/ui-ux-skill/VERSION")"
          test "$INSTALLED_VERSION" = "$EXPECTED_VERSION"
