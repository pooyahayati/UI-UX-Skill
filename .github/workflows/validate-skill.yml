name: Validate Skill and Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Local release validation
        run: python3 scripts/validate_release.py

      - name: Product route validation
        run: python3 scripts/validate_product_routes.py

      - name: Shared rule validation
        run: python3 scripts/validate_shared_rules.py

      - name: Specialist registry validation
        run: python3 scripts/validate_specialists.py

      - name: Behavioral eval fixture validation
        run: python3 scripts/validate_eval_fixtures.py

      - name: Eval harness smoke test
        run: |
          python3 scripts/prepare_eval_run.py existing-safe-improvement --output "$RUNNER_TEMP/uiux-eval"
          test -f "$RUNNER_TEMP/uiux-eval/RUN.json"
          test -f "$RUNNER_TEMP/uiux-eval/fixture/README.md"

      - name: Package release artifacts
        run: python3 scripts/package_release.py --output dist

      - name: Verify ZIP archives
        run: |
          unzip -t dist/ui-ux-skill-claude-v*.zip
          unzip -t dist/ui-ux-plugin-v*.zip
          cat dist/SHA256SUMS.txt

      - name: Fetch official OpenAI skill tools
        run: git clone --depth 1 https://github.com/openai/skills.git "$RUNNER_TEMP/openai-skills"

      - name: Official OpenAI quick validation
        run: |
          python3 "$RUNNER_TEMP/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py" \
            skills/ui-ux-skill

      - name: Codex installer smoke test
        if: github.event_name == 'push'
        run: |
          python3 "$RUNNER_TEMP/openai-skills/skills/.system/skill-installer/scripts/install-skill-from-github.py" \
            --repo pooyahayati/UI-UX-Skill \
            --path skills/ui-ux-skill \
            --ref "$GITHUB_SHA" \
            --dest "$RUNNER_TEMP/installed-skills"

          test -f "$RUNNER_TEMP/installed-skills/ui-ux-skill/SKILL.md"
