name: uiux-wps-specimen
services:
  db-current:
    image: mariadb:11.4
    environment: &db-env
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wps
      MARIADB_PASSWORD: ${WPS_DB_PASSWORD:?Set a synthetic test password}
      MARIADB_ROOT_PASSWORD: ${WPS_DB_ROOT_PASSWORD:?Set a synthetic root password}
    volumes: [db-current:/var/lib/mysql]
    healthcheck: &db-health
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30
  db-min:
    image: mariadb:11.4
    environment: *db-env
    volumes: [db-min:/var/lib/mysql]
    healthcheck: *db-health
  current:
    image: wordpress:php8.3-apache
    depends_on:
      db-current: {condition: service_healthy}
    ports: ["127.0.0.1:8790:80"]
    environment:
      WORDPRESS_DB_HOST: db-current
      WORDPRESS_DB_USER: wps
      WORDPRESS_DB_PASSWORD: ${WPS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WPS_CORE_VERSION: "7.1.3"
      WPS_SITE_URL: "http://127.0.0.1:8790"
      WPS_ADMIN_PASSWORD: ${WPS_ADMIN_PASSWORD:?Set a synthetic admin password}
      WORDPRESS_CONFIG_EXTRA: |
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_MODS', true);
        define('WP_DEBUG_DISPLAY', false);
    entrypoint: ["bash", "/fixture/prepare-core.sh"]
    volumes:
      - wp-current:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/wps-specimen:ro
      - ./:/fixture:ro
  minimum:
    image: wordpress:php8.3-apache
    depends_on:
      db-min: {condition: service_healthy}
    ports: ["127.0.0.1:8791:80"]
    environment:
      WORDPRESS_DB_HOST: db-min
      WORDPRESS_DB_USER: wps
      WORDPRESS_DB_PASSWORD: ${WPS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WPS_CORE_VERSION: "6.8"
      WPS_SITE_URL: "http://127.0.0.1:8791"
      WPS_ADMIN_PASSWORD: ${WPS_ADMIN_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_MODS', true);
        define('WP_DEBUG_DISPLAY', false);
    entrypoint: ["bash", "/fixture/prepare-core.sh"]
    volumes:
      - wp-min:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/wps-specimen:ro
      - ./:/fixture:ro
volumes:
  db-current:
  db-min:
  wp-current:
  wp-min:
